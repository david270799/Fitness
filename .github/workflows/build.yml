name: Сборка APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Восстановить ключ подписи
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Собрать подписанный release-APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/IRON-1.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Собрать debug-APK (секретов подписи нет)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/IRON-1.0.${GITHUB_RUN_NUMBER}-debug.apk"

      - name: Юнит-тесты
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Выложить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: IRON-1.0.${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      - name: Создать релиз GitHub
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: IRON 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: Автоматическая сборка из коммита ${{ github.sha }}.
          files: out/*.apk
